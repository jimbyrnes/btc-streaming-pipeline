<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BTC Streaming Pipeline</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --border:  #30363d;
      --text:    #e6edf3;
      --muted:   #8b949e;
      --blue:    #58a6ff;
      --green:   #3fb950;
      --red:     #f85149;
      --orange:  #d29922;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Courier New', monospace;
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    header {
      padding: 10px 20px; flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    h1 { font-size: 0.85rem; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
    #status { font-size: 0.78rem; }
    #status.live       { color: var(--green); }
    #status.connecting { color: var(--orange); }

    main {
      flex: 1; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden;
    }
    .panel { display: flex; flex-direction: column; overflow: hidden; }
    #left-panel { border-right: 1px solid var(--border); }

    .chart-wrap { padding: 10px 16px; height: 165px; flex-shrink: 0; }

    .panel-title {
      padding: 5px 16px; flex-shrink: 0;
      font-size: 0.68rem; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.1em;
      border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between;
    }
    .panel-title .badge { color: var(--blue); }

    .feed { flex: 1; overflow-y: auto; }

    /* ── Trades ── */
    .trade-row {
      display: grid; grid-template-columns: 72px 14px 100px 1fr;
      gap: 6px; align-items: center;
      padding: 4px 16px;
      border-bottom: 1px solid rgba(48,54,61,0.5);
      font-size: 0.78rem;
      transition: background 0.6s ease;
    }
    .trade-row.flash { background: rgba(88,166,255,0.1); }
    .trade-row .qty  { color: var(--muted); font-size: 0.7rem; }
    .up   { color: var(--green); }
    .down { color: var(--red); }
    .flat { color: var(--muted); }

    /* ── Alert cards ── */
    .alert-card {
      margin: 8px 12px; padding: 10px 14px;
      background: var(--surface);
      border: 1px solid var(--border); border-left-width: 3px;
      border-radius: 6px;
      animation: slide-in 0.25s ease;
    }
    .alert-card.up      { border-left-color: var(--green); }
    .alert-card.down    { border-left-color: var(--red); }
    .alert-card.neutral { border-left-color: var(--blue); }
    .alert-card.spike   { border-left-color: var(--orange); animation: slide-in 0.25s ease, pulse-border 1s ease 3; }
    @keyframes pulse-border {
      0%, 100% { box-shadow: none; }
      50%       { box-shadow: 0 0 8px var(--orange); }
    }
    .spike-badge { font-size: 0.68rem; color: var(--orange); float: right; }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .alert-window { font-size: 0.67rem; color: var(--muted); margin-bottom: 4px; }
    .alert-price  { font-size: 1.3rem; color: var(--blue); font-weight: bold; margin-bottom: 5px; }
    .alert-stats  { font-size: 0.7rem; color: var(--muted); display: flex; gap: 14px; }

    .empty { padding: 18px 16px; color: var(--muted); font-size: 0.75rem; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>

<header>
  <h1>&#9889; BTC Streaming Pipeline</h1>
  <div id="status" class="connecting">&#9679; connecting&#8230;</div>
</header>

<main>
  <div class="panel" id="left-panel">
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
    <div class="panel-title">
      <span>Live Trades</span>
      <span class="badge" id="count">0</span>
    </div>
    <div id="trades" class="feed"><div class="empty">Waiting for trades&#8230;</div></div>
  </div>

  <div class="panel" id="right-panel">
    <div class="panel-title">
      <span>Flink Windows</span>
      <span style="color:var(--muted)">10s tumbling</span>
    </div>
    <div id="alerts" class="feed"><div class="empty">Waiting for Flink windows&#8230;</div></div>
  </div>
</main>

<script>
// ── Chart ────────────────────────────────────────────────────────────────────
const MAX_PTS = 60;
const labels = [], prices = [];

const chart = new Chart(document.getElementById('chart').getContext('2d'), {
  type: 'line',
  data: {
    labels,
    datasets: [{
      data: prices,
      borderColor: '#58a6ff',
      backgroundColor: 'rgba(88,166,255,0.07)',
      borderWidth: 1.5, pointRadius: 0, tension: 0.3, fill: true,
    }]
  },
  options: {
    animation: false, responsive: true, maintainAspectRatio: false,
    scales: {
      x: {
        ticks: { color: '#8b949e', maxTicksLimit: 6, font: { size: 10 } },
        grid: { color: '#21262d' },
      },
      y: {
        ticks: {
          color: '#8b949e', font: { size: 10 },
          callback: v => '$' + Math.round(v).toLocaleString(),
        },
        grid: { color: '#21262d' },
      },
    },
    plugins: { legend: { display: false } },
  },
});

function pushChart(ts, price) {
  labels.push(ts.slice(11, 19));
  prices.push(price);
  if (labels.length > MAX_PTS) { labels.shift(); prices.shift(); }
  chart.update('none');
}

// ── Trades feed ───────────────────────────────────────────────────────────────
let tradeCount = 0, prevPrice = null;
const tradesFeed = document.getElementById('trades');
const countEl    = document.getElementById('count');

function addTrade(t) {
  if (tradeCount === 0) tradesFeed.innerHTML = '';
  countEl.textContent = ++tradeCount;

  const price = parseFloat(t.price);
  const dir   = prevPrice === null ? '&#8212;' : price > prevPrice ? '&#9650;' : price < prevPrice ? '&#9660;' : '&#8212;';
  const cls   = prevPrice === null ? 'flat'    : price > prevPrice ? 'up'      : price < prevPrice ? 'down'    : 'flat';
  prevPrice   = price;

  pushChart(t.timestamp, price);

  const row = document.createElement('div');
  row.className = 'trade-row flash';
  row.innerHTML =
    `<span>${t.timestamp.slice(11,19)}</span>` +
    `<span class="${cls}">${dir}</span>` +
    `<span>$${price.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</span>` +
    `<span class="qty">${t.quantity} BTC</span>`;

  tradesFeed.prepend(row);
  requestAnimationFrame(() => row.classList.remove('flash'));
  if (tradesFeed.children.length > 25) tradesFeed.lastChild.remove();
}

// ── Alerts feed ───────────────────────────────────────────────────────────────
let prevAlertPrice = null, alertCount = 0;
const alertsFeed = document.getElementById('alerts');

function addAlert(a) {
  if (alertCount === 0) alertsFeed.innerHTML = '';
  alertCount++;

  const price = parseFloat(a.avg_price);
  const trend = prevAlertPrice === null ? 'neutral' : price > prevAlertPrice ? 'up' : price < prevAlertPrice ? 'down' : 'neutral';
  prevAlertPrice = price;

  const card = document.createElement('div');
  card.className = `alert-card ${trend}${a.spike ? ' spike' : ''}`;
  const spikeBadge = a.spike
    ? `<span class="spike-badge">&#9889; ${a.price_change_pct.toFixed(2)}%</span>`
    : '';
  card.innerHTML =
    `<div class="alert-window">${a.window_start.slice(11,19)} &#8594; ${a.window_end.slice(11,19)}${spikeBadge}</div>` +
    `<div class="alert-price">$${price.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>` +
    `<div class="alert-stats"><span>${a.trade_count} trades</span><span>${a.total_volume} BTC vol</span></div>`;

  alertsFeed.prepend(card);
  if (alertsFeed.children.length > 10) alertsFeed.lastChild.remove();
}

// ── SSE connections ───────────────────────────────────────────────────────────
const statusEl = document.getElementById('status');
let openCount  = 0;

function onOpen() {
  if (++openCount === 2) { statusEl.textContent = '&#9679; live'; statusEl.className = 'live'; }
}
function onError() {
  openCount = 0;
  statusEl.textContent = '&#9679; reconnecting&#8230;';
  statusEl.className = 'connecting';
}

const tradeSource = new EventSource('/stream/trades');
tradeSource.onopen   = onOpen;
tradeSource.onerror  = onError;
tradeSource.onmessage = e => addTrade(JSON.parse(e.data));

const alertSource = new EventSource('/stream/alerts');
alertSource.onopen   = onOpen;
alertSource.onerror  = onError;
alertSource.onmessage = e => addAlert(JSON.parse(e.data));
</script>
</body>
</html>
